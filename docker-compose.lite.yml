# The free setup: a 1 GB server runs the API (with the bot and the daily jobs inside it),
# Postgres, Redis, Caddy and a daily backup. The website lives on Vercel. See deploy/BEPUL.md.
#   cp deploy/.env.lite.example deploy/.env.lite   # fill in
#   docker compose -f docker-compose.lite.yml --env-file deploy/.env.lite up -d --build
name: pit-lite

x-backend: &backend
  build: ./backend
  image: pit-lite-backend # one image for migrate and api: built once
  env_file: ./deploy/.env.lite
  environment:
    PIT_DATABASE_URL: postgresql+psycopg://pit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pit
    PIT_REDIS_URL: redis://redis:6379/0
    PIT_LOCAL_STORAGE_DIR: /app/.storage
    PIT_INLINE_TASKS: "true" # no Celery: proofs are checked and daily jobs run in the API
  volumes:
    - storage:/app/.storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    # Sized for a 1 GB machine: a few connections, small buffers.
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_USER: pit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pit -d pit"]
      interval: 5s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped

  migrate: # once per deploy: migrations + catalog seed + Telegram webhook (all idempotent)
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m pit.cli seed && (python -m pit.cli telegram-setup || echo 'WARNING: Telegram setup failed')"]
    restart: "no"

  api:
    <<: *backend
    mem_limit: 640m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy: # HTTPS (Let's Encrypt) in front of the API
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.api:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    depends_on:
      - api
    restart: unless-stopped

  # Daily pg_dump + photo archive into the `backups` volume, 14 days kept. See deploy/BEPUL.md.
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - storage:/storage:ro
      - backups:/backups
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  backups:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
