# Local infrastructure. Host ports are shifted (5433, 6380) so they never clash with
# a Postgres/Redis already running on the machine. Proof photos are stored on disk locally
# (PIT_STORAGE=local); production uses any S3-compatible store (PIT_STORAGE=s3).
name: pit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pit
      POSTGRES_PASSWORD: pit
      POSTGRES_DB: pit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pit -d pit"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
