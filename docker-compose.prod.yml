# Production on a single server:
#   cp deploy/.env.prod.example deploy/.env.prod   # fill in secrets and DOMAIN
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
name: pit-prod

x-backend: &backend
  build: ./backend
  env_file: ${PIT_ENV_FILE:-./deploy/.env.prod}
  environment:
    PIT_DATABASE_URL: postgresql+psycopg://pit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pit
    PIT_REDIS_URL: redis://redis:6379/0
    PIT_LOCAL_STORAGE_DIR: /app/.storage
  volumes:
    - storage:/app/.storage
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pit -d pit"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:  # runs once per deploy: migrations + catalog seed + Telegram webhook (all idempotent)
    <<: *backend
    # A Telegram outage must not block the deploy, so its setup only warns.
    command: ["sh", "-c", "alembic upgrade head && python -m pit.cli seed && (python -m pit.cli telegram-setup || echo 'WARNING: Telegram setup failed')"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:  # AI verification of proofs
    <<: *backend
    command: ["celery", "-A", "pit.worker", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:  # 00:15 close days, 08:00 / 20:00 coach messages (Asia/Tashkent)
    <<: *backend
    command: ["celery", "-A", "pit.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    restart: unless-stopped

  caddy:  # HTTPS (Let's Encrypt) + routing: /api -> api, everything else -> web
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

  # Daily pg_dump + photo archive into the `backups` volume, 14 days kept. See README → Zaxira.
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - storage:/storage:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
  backups:
